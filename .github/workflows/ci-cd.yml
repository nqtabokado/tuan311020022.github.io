# ============================================================================
# WORKFLOW CI/CD cho project 2 phần: client (Vue 2) + server (Flask)
#
# Luồng chạy tổng quát:
#
#   push / PR vào main
#          │
#          ├──────────────┬──────────────┐
#          ▼              ▼              │
#   ┌─────────────┐ ┌─────────────┐      │  2 job CI chạy SONG SONG
#   │ test-server │ │ test-client │      │  (mỗi job 1 máy ảo riêng)
#   │ flake8      │ │ eslint      │      │
#   │ pytest      │ │ jest + build│      │
#   └─────────────┘ └─────────────┘      │
#          │              │              │
#          └──────┬───────┘              │
#                 ▼ cả hai đều pass      │
#   ┌──────────────────────────────┐     │
#   │ job: build-and-push (CD)     │ ◀───┘
#   │ build 2 image: server+client │
#   │ chỉ khi push vào main        │
#   └──────────────────────────────┘
#
# Chỉ cần 1 job CI fail là job CD bị bỏ qua: code chưa qua kiểm tra thì
# không bao giờ được đóng gói phát hành.
# ============================================================================

name: CI/CD

# ----------------------------------------------------------------------------
# "on:" — SỰ KIỆN nào sẽ kích hoạt workflow này?
# ----------------------------------------------------------------------------
on:
  # (1) Khi có commit được push thẳng lên nhánh main
  #     (bao gồm cả lúc merge 1 Pull Request vào main — merge cũng là 1 push).
  push:
    branches: ["main"]

  # (2) Khi có người mở / cập nhật Pull Request có đích là nhánh main.
  #     Mục đích: kiểm tra code TRƯỚC khi cho merge, để main luôn "xanh".
  pull_request:
    branches: ["main"]

jobs:

  # ==========================================================================
  # JOB 1 — CI phía SERVER (Flask): lint + unit test Python
  # ==========================================================================
  test-server:
    name: Server — Lint & Test (Flask)
    runs-on: ubuntu-latest

    # "defaults.run.working-directory" = mọi lệnh "run:" trong job này đều
    # được chạy sẵn trong thư mục server/, khỏi phải "cd server" từng bước.
    # Lưu ý: nó KHÔNG ảnh hưởng tới các bước dùng "uses:".
    defaults:
      run:
        working-directory: server

    steps:
      # Bước 1: Lấy code của repo về máy ảo (VM lúc đầu trống trơn).
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài Python. Nên khớp với phiên bản bạn dùng ở máy local.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache thư mục pip giữa các lần chạy => lần sau cài gói nhanh hơn.
          # Cache làm mới khi file requirements*.txt thay đổi; vì file nằm
          # trong server/ nên phải chỉ đường dẫn rõ ràng cho action.
          cache: "pip"
          cache-dependency-path: server/requirements*.txt

      # Bước 3: Cài thư viện. requirements-dev.txt chứa "-r requirements.txt"
      # nên cài luôn cả thư viện chính (Flask...) lẫn công cụ dev.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Bước 4: LINT — đọc code (KHÔNG chạy) để bắt lỗi style / lỗi rõ ràng:
      # import thừa, biến không dùng, thụt lề sai, dòng dài quá 100 ký tự...
      - name: Lint with flake8
        run: flake8 app run.py --max-line-length=100

      # Bước 5: TEST — chạy code thật để kiểm tra LOGIC có đúng không.
      # Dùng "python -m pytest" thay vì "pytest" để thư mục hiện tại được
      # thêm vào sys.path => "from app import ..." trong tests/ import được.
      - name: Run tests
        run: python -m pytest -v

  # ==========================================================================
  # JOB 2 — CI phía CLIENT (Vue 2): lint + unit test + thử build
  # Không khai báo "needs:" nên job này chạy SONG SONG với test-server.
  # ==========================================================================
  test-client:
    name: Client — Lint, Test & Build (Vue 2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài Node. Cache theo package-lock.json: lock file chưa đổi thì
      # lần chạy sau lấy lại cache npm, đỡ phải tải lại từ đầu.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # "npm ci" khác "npm install": cài ĐÚNG version ghi trong
      # package-lock.json và xoá node_modules cũ trước khi cài
      # => máy ai chạy cũng ra kết quả giống nhau. Luôn dùng npm ci trong CI.
      - name: Install dependencies
        run: npm ci

      # LINT — ESLint. "--no-fix" để CI chỉ BÁO lỗi chứ không tự sửa;
      # CI sửa code thì lỗi bị giấu đi, lần sau vẫn commit sai như cũ.
      - name: Lint with ESLint
        run: npm run lint -- --no-fix

      # TEST — Jest + @vue/test-utils. Các test đã mock module gọi API nên
      # KHÔNG cần server Flask chạy kèm.
      - name: Run unit tests
        run: npm run test:unit

      # BUILD — bước bảo vệ cuối: code có thể qua được lint và test nhưng
      # vẫn vỡ lúc build (import sai đường dẫn, lỗi cú pháp template...).
      - name: Build production bundle
        run: npm run build

  # ==========================================================================
  # JOB 3 — CD (Continuous Delivery): đóng gói 2 image và đẩy lên
  # GitHub Container Registry (ghcr.io).
  # ==========================================================================
  build-and-push:
    name: Build & Push Docker images

    # "needs: [a, b]" => chờ CẢ HAI job CI xong VÀ thành công mới chạy.
    # Chỉ cần 1 job fail thì job này bị bỏ qua (skipped). Đây là "cổng chặn".
    needs: [test-server, test-client]

    # Điều kiện thêm: chỉ chạy khi sự kiện là PUSH vào main.
    # => Với pull_request: chỉ chạy CI, KHÔNG build/push image,
    #    vì code trong PR chưa được duyệt, chưa nên phát hành.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Quyền của GITHUB_TOKEN trong job này. Mặc định nên cấp TỐI THIỂU,
    # cần gì khai báo nấy (nguyên tắc "least privilege").
    permissions:
      contents: read    # chỉ đọc code, không ghi gì vào repo
      packages: write   # BẮT BUỘC để push image lên ghcr.io

    # "strategy.matrix" = chạy job này NHIỀU LẦN, mỗi lần thay 1 bộ biến.
    # Ở đây thành 2 lượt chạy song song: 1 cho server, 1 cho client.
    # Nhờ vậy khỏi phải copy-paste y hệt các bước build cho từng image.
    strategy:
      matrix:
        include:
          - name: server      # -> ghcr.io/<owner>/<repo>/server
            context: ./server
          - name: client      # -> ghcr.io/<owner>/<repo>/client
            context: ./client

    env:
      REGISTRY: ghcr.io
      # github.repository có dạng "owner/tên-repo".
      # Lưu ý: tên image trên ghcr.io phải viết thường.
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.name }}

    steps:
      # Job này chạy trên VM KHÁC với 2 job CI, nên phải checkout lại —
      # các job không dùng chung ổ đĩa.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}            # người kích hoạt workflow
          # GITHUB_TOKEN do GitHub tự sinh cho mỗi lần chạy, hết hạn khi
          # job kết thúc. Không cần tự tạo secret. Quyền của nó chính là
          # phần "permissions:" ở trên.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          # context = thư mục chứa Dockerfile và code để build.
          # Lượt chạy nào thì lấy đúng thư mục của lượt đó.
          context: ${{ matrix.context }}
          push: true       # build xong thì đẩy lên luôn (false = chỉ build thử)
          # Gắn 2 tag cho cùng 1 image:
          # - latest       : luôn trỏ tới bản mới nhất, tiện "docker pull"
          # - <commit SHA> : cố định theo từng commit, không bị ghi đè
          #                  => dùng để rollback về đúng phiên bản cũ.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
