# Tên workflow này — hiện trong tab "Actions" trên GitHub, TÁCH RIÊNG khỏi
# CI (bạn sẽ thấy 2 danh sách run khác nhau: "CI" và "CD").
name: CD

# ============================================================
# PHẦN "on:" — quyết định: WORKFLOW NÀY CHẠY KHI NÀO?
#
# Vì cd.yml và ci.yml là 2 FILE KHÁC NHAU (2 workflow độc lập), không thể
# dùng "needs:" để nối chúng — needs chỉ nối được các job TRONG CÙNG 1 file.
# Thay vào đó phải dùng "workflow_run": nghĩa là "hãy chạy workflow CD này
# mỗi khi một workflow khác (được đặt tên trong "workflows:") vừa chạy xong".
# ============================================================
on:
  workflow_run:
    workflows: ["CI"]        # Phải khớp CHÍNH XÁC với dòng "name: CI" ở đầu
                              # file ci.yml. Đây không phải tên file (ci.yml),
                              # mà là tên workflow bên trong file đó.
                              # Gõ sai/đổi tên mà quên sửa ở đây -> CD sẽ
                              # không bao giờ được kích hoạt, mà cũng không
                              # có lỗi nào hiện ra để biết tại sao.

    types: [completed]       # Chỉ quan tâm sự kiện "CI đã chạy XONG" (dù
                              # pass hay fail đều tính là "completed" — vì
                              # vậy bên dưới còn phải tự kiểm tra kết quả
                              # bằng "if:", xem dòng 34.

    branches: [main]         # Chỉ lắng nghe CI chạy trên nhánh main.
                              # Nhớ lại: ci.yml chạy trên MỌI nhánh (push:
                              # branches: ["**"]), nhưng ta chỉ muốn build
                              # & phát hành Docker image khi code đã ở main
                              # (nhánh ổn định), không phải mỗi nhánh feature
                              # nháp nào cũng tự động ra 1 image mới.

# ============================================================
# PHẦN "jobs:" — chỉ có 1 job: build image và đẩy lên registry.
# ============================================================
jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    # QUAN TRỌNG NHẤT của file này: "workflow_run" sẽ kích hoạt job này
    # cả khi CI THẤT BẠI (vì "completed" bao gồm cả fail lẫn pass).
    # Dòng "if" dưới đây chính là nơi thật sự chặn: nếu CI fail thì job
    # này vẫn "được gọi" nhưng dừng ngay lập tức, không chạy step nào cả,
    # và hiện màu xám (skipped) thay vì đỏ (failed) trên giao diện.
    if: github.event.workflow_run.conclusion == 'success'

    # Quyền hạn mà job này được cấp khi chạy (GitHub Actions mặc định cấp
    # quyền rất hạn chế để an toàn, cần khai báo rõ cần quyền gì).
    permissions:
      contents: read          # chỉ cần đọc code, không cần ghi gì vào repo
      packages: write         # BẮT BUỘC phải có để được phép đẩy (push)
                               # Docker image lên GitHub Container Registry

    # Biến môi trường dùng chung cho các step bên dưới, đặt ở đây cho gọn,
    # đỡ phải gõ lại "ghcr.io" hay tên repo nhiều lần.
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}   # tự động là "username/tên-repo"

    steps:
      # Bước 1: Tải code về máy ảo — NHƯNG phải lấy ĐÚNG commit mà CI vừa
      # test, không phải commit mới nhất hiện tại trên main.
      - name: Checkout code (đúng commit mà CI vừa test)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Lý do phải chỉ định "ref" rõ ràng: trigger "workflow_run" mặc
          # định sẽ checkout nhánh mặc định (main) tại THỜI ĐIỂM HIỆN TẠI,
          # không tự nhớ commit nào đã được CI kiểm tra. Nếu bỏ dòng này,
          # rủi ro là: ai đó push thêm 1 commit MỚI (chưa qua CI) đúng lúc
          # CD đang chạy -> Docker image bị build từ code CHƯA được test.
          # "head_sha" đảm bảo build đúng 100% commit mà CI vừa pass.

      # Bước 2: Đăng nhập vào GitHub Container Registry để có quyền push.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}            # người/bot kích hoạt workflow
          password: ${{ secrets.GITHUB_TOKEN }}     # token tự động GitHub cấp
                                                     # sẵn cho mỗi lần chạy Action,
                                                     # KHÔNG cần tự tạo secret nào

      # Bước 3: Build Docker image từ Dockerfile ở gốc project, rồi đẩy
      # (push) thẳng lên registry — đây chính là hành động "phát hành".
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .          # thư mục chứa Dockerfile (gốc project)
          push: true           # true = build xong thì đẩy luôn, không chỉ
                                # build rồi để đó (nếu false chỉ để test build
                                # có lỗi không, ví dụ chạy trong PR)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          # Đẩy lên với 2 "tag" (2 cách gọi tên cho cùng 1 image):
          # - "latest": luôn trỏ tới bản mới nhất, tiện để `docker pull` mà
          #   không cần nhớ tên phiên bản
          # - theo commit SHA: mỗi commit ra 1 image cố định, không bao giờ
          #   bị ghi đè — hữu ích khi cần rollback về đúng bản cũ nào đó